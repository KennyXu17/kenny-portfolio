<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <style>
    :root {
      --accent1: #4cc3ff;  /* 蓝色饼块 */
      --accent2: #f56b5d;  /* 红色饼块 */
      --accent3: #ffd94d;  /* 黄色饼块 / 符号 / 轴线 */
      --accent4: #6ddf9c;  /* 绿色柱子 */
      --file: #eeeeee;     /* 文件灰色 */
      --fileLine: #999999; /* 文件线条 */
      --lens: #b3d9ff;     /* 放大镜镜面 */
      --stroke: #5a6d7c;   /* 放大镜描边 */
    }
    .bars rect { rx: 4; }
    .file { fill: var(--file); stroke: var(--fileLine); stroke-width: 2; }
    .file-line { stroke: var(--fileLine); stroke-width: 3; }
    .lens { fill: var(--lens); stroke: var(--stroke); stroke-width: 10; }
    .handle { stroke: var(--stroke); stroke-width: 14; stroke-linecap: round; }
    .axis { stroke: var(--accent3); stroke-width: 6; stroke-linecap: round; }
    .symbol { fill: var(--accent3); font-size: 64px; font-family: Arial, sans-serif; font-weight: bold; text-anchor: middle; dominant-baseline: middle; }
  </style>

  <!-- 饼图 -->
  <g transform="translate(140,100)">
    <path d="M0,0 L60,0 A60,60 0 0,1 0,-60 Z" fill="var(--accent1)"/>
    <path d="M0,0 L0,-60 A60,60 0 0,1 52,-30 Z" fill="var(--accent2)"/>
    <path d="M0,0 L52,-30 A60,60 0 0,1 30,52 Z" fill="var(--accent3)"/>
    <path d="M0,0 L30,52 A60,60 0 0,1 -60,0 Z" fill="var(--accent4)"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#fff" stroke-width="2"/>
  </g>

  <!-- 柱状图 + 坐标轴 -->
  <g transform="translate(90,260)">
    <!-- 坐标轴 -->
    <line x1="0" y1="160" x2="220" y2="160" class="axis"/>
    <line x1="0" y1="0"   x2="0"   y2="160" class="axis"/>

    <!-- 柱状图 -->
    <rect x="20"  y="60" width="30" height="100" fill="#ffd94d"/>
    <rect x="70"  y="20" width="30" height="140" fill="#6ddf9c"/>
    <rect x="120" y="40" width="30" height="120" fill="#4cc3ff"/>
    <rect x="170" y="10" width="30" height="150" fill="#f56b5d"/>
  </g>

  <!-- 文件图标 -->
  <g transform="translate(300,80)">
    <path d="M0,0 h90 v120 h-90 z" class="file"/>
    <path d="M90,0 v30 h-30 v-30" class="file"/>
    <line x1="10" y1="50" x2="70" y2="50" class="file-line"/>
    <line x1="10" y1="70" x2="70" y2="70" class="file-line"/>
    <line x1="10" y1="90" x2="70" y2="90" class="file-line"/>
  </g>

  <!-- 放大镜 -->
  <g transform="translate(280,280)">
    <circle r="80" class="lens"/>
    <line x1="60" y1="60" x2="120" y2="120" class="handle"/>
    <text x="0" y="0" class="symbol">$</text>
  </g>
</svg>
